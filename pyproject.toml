[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibm-aml-riskiq"
version = "1.0.0"
description = "IBM AML RiskIQ Enterprise Suite -- AI-driven anti-money-laundering & financial crime intelligence platform (6 Business Problems over the IBM Transactions for AML Kaggle dataset)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nandagopal R" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
target-version = ["py310", "py311"]
extend-exclude = "notebooks/"

[tool.isort]
profile = "black"
line_length = 110
skip_glob = ["notebooks/*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["notebooks/"]
# pydantic.mypy: without this plugin, mypy cannot statically type classes built at
# runtime via pydantic.create_model() (used by the BP1/BP2/BP4/BP5 scoring services
# for their request/response schemas) -- it sees them as plain `type[Any]` and raises
# false-positive attribute/assignment errors on every field access.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks", "github_repo"]
