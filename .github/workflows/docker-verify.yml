name: Docker Build & Run Verification

# Verifies the 5 scoring services (BP1, BP2, BP3, BP4, BP5) build, start, refuse to start
# without an API key (fail-closed default), and serve a real /health check -- plus a separate
# smoke test of BP6's one-shot batch reporting job (no port/health endpoint by design), plus
# (2026-10-12, RBAC/case-management phase) the case-management service, which additionally
# exercises one real negative-authorization check (an unauthenticated write -> 401) against
# the live running container, not only the unit/integration test suite.
#
# BP2 and BP3 were excluded 2026-10-03 (BP2: committed validation report predated two keys
# bp2_scoring_service.py now reads at import time, KeyError on start; BP3: the real
# near-train-flagged lookup Parquet did not exist on disk yet). Both re-added 2026-10-12 after
# the user re-ran BP2 Notebook 3 and BP3 Notebook 3 (LI-Medium) for real and the resulting
# artifacts were committed -- see docs/audit/DEFECT_REGISTER.md's DEF-001/DEF-002 resolution
# notes and MODEL_REGISTRY.md for the real file sizes/hashes.
#
# All 5 scoring Dockerfiles set AML_RISKIQ_REQUIRE_AUTH=true by default (2026-10-10 hardening);
# every job below both proves the fail-closed default (no key -> container refuses to start)
# and runs the real container with a disposable CI-only key to reach /health.

on: [push, pull_request]

jobs:
  bp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp1_transaction_monitoring_detection/Dockerfile -t bp1-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp1-no-key bp1-scoring; then
            echo "ERROR: bp1 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp1 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp1 -e AML_RISKIQ_REQUIRE_AUTH=true -e AML_RISKIQ_API_KEYS=ci-test-key -p 8000:8000 bp1-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs bp1
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp1 || true

  bp2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp2_typology_redflag_detection/Dockerfile -t bp2-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp2-no-key bp2-scoring; then
            echo "ERROR: bp2 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp2 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp2 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8001:8001 bp2-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/health; then exit 0; fi
            sleep 2
          done
          docker logs bp2
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp2 || true

  bp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp3_network_graph_intelligence/Dockerfile -t bp3-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp3-no-key bp3-scoring; then
            echo "ERROR: bp3 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp3 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp3 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8003:8003 bp3-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8003/health; then exit 0; fi
            sleep 2
          done
          docker logs bp3
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp3 || true

  bp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp4_structuring_smurfing_detection/Dockerfile -t bp4-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp4-no-key bp4-scoring; then
            echo "ERROR: bp4 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp4 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp4 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8004:8004 bp4-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8004/health; then exit 0; fi
            sleep 2
          done
          docker logs bp4
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp4 || true

  bp5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp5_correspondent_banking_crossborder_risk/Dockerfile -t bp5-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp5-no-key bp5-scoring; then
            echo "ERROR: bp5 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp5 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp5 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8002:8002 bp5-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8002/health; then exit 0; fi
            sleep 2
          done
          docker logs bp5
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp5 || true

  bp6-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BP6 batch image
        run: docker build -f src/docker/bp6_enterprise_compliance_monitoring/Dockerfile -t bp6-rollup .
      - name: Execute BP6 rollup against committed report evidence
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            -v "$GITHUB_WORKSPACE/models:/app/models" \
            bp6-rollup
      - name: Verify generated rollup package
        run: |
          set -euo pipefail
          package="reports/bp6_enterprise_compliance_monitoring/executive_package"
          for artifact in \
            "BP6_Platform_Rollup_Report.docx" \
            "BP6_Platform_Rollup_Workbook.xlsx" \
            "BP6_Platform_Rollup_Dashboard.html" \
            "BP6_Platform_Rollup_Deck.pptx"; do
            test -s "$package/$artifact"
          done
          test -s "reports/bp6_enterprise_compliance_monitoring/PLATFORM_CARD.md"
          echo "PASS: BP6 batch job exited successfully and required report outputs are non-empty."

  case-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/case_management/Dockerfile -t case-management .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name case-management-no-key case-management; then
            echo "ERROR: case-management started without API-key configuration"
            exit 1
          else
            echo "PASS: case-management refused to start without API-key configuration"
          fi
      - name: Run
        run: >
          docker run -d --name case-management
          -e AML_RISKIQ_API_KEYS=admin:ci-test-key
          -p 8005:8005 case-management
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8005/health; then exit 0; fi
            sleep 2
          done
          docker logs case-management
          exit 1
      - name: Exercise the real RBAC matrix against the running container
        run: |
          set -euo pipefail
          KEY="ci-test-key"
          BASE="http://localhost:8005"
          # admin-role key creates an alert
          ALERT_ID=$(curl -sf -X POST "$BASE/alerts" -H "X-API-Key: $KEY" -H "Content-Type: application/json" \
            -d '{"entity_ref":"ci-acct-1","business_problem":"BP1","detection_source":"xgboost_champion","risk_score":0.9,"selected_threshold":0.5,"model_name":"xgboost_v1"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['alert_id'])")
          echo "Created alert: $ALERT_ID"
          # a request with no key at all must be refused (401) -- real negative-auth check
          # against the actual running container, not just a unit test.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/alerts/$ALERT_ID/notes" \
            -H "Content-Type: application/json" -d '{"text":"should be rejected"}')
          if [ "$STATUS" != "401" ]; then
            echo "ERROR: expected 401 for an unauthenticated write, got $STATUS"
            exit 1
          fi
          echo "PASS: unauthenticated write correctly refused (401)."
      - name: Teardown
        if: always()
        run: docker rm -f case-management || true
