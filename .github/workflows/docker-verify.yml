name: Docker Build & Run Verification

# Verifies the 5 scoring services (BP1, BP2, BP3, BP4, BP5) build, start, refuse to start
# without an API key (fail-closed default), and serve a real /health check -- plus a separate
# smoke test of BP6's one-shot batch reporting job (no port/health endpoint by design), plus
# (2026-10-12, RBAC/case-management phase) the case-management service, which additionally
# exercises one real negative-authorization check (an unauthenticated write -> 401) against
# the live running container, not only the unit/integration test suite.
#
# BP2 and BP3 were excluded 2026-10-03 (BP2: committed validation report predated two keys
# bp2_scoring_service.py now reads at import time, KeyError on start; BP3: the real
# near-train-flagged lookup Parquet did not exist on disk yet). Both re-added 2026-10-12 after
# the maintainer re-ran BP2 Notebook 3 and BP3 Notebook 3 (LI-Medium) for real and the resulting
# artifacts were committed -- see docs/audit/DEFECT_REGISTER.md's DEF-001/DEF-002 resolution
# notes and MODEL_REGISTRY.md for the real file sizes/hashes.
#
# All 5 scoring Dockerfiles set AML_RISKIQ_REQUIRE_AUTH=true by default (2026-10-10 hardening);
# every job below both proves the fail-closed default (no key -> container refuses to start)
# and runs the real container with a disposable CI-only key to reach /health.
#
# integrated-workflow (2026-10-12, End-to-End AML Workflow Integration phase) is different in
# kind from every job above: those each build and smoke-test ONE service in isolation.
# integrated-workflow instead builds the root-level docker-compose.yml's case-management +
# bp3-network-graph-intelligence together, exercises a real scoring-to-alert round trip over
# the real network between the two live containers, and verifies idempotency -- proving the
# actual wired-together deployment, not just each service on its own.

on: [push, pull_request]

jobs:
  bp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/bp1_transaction_monitoring_detection/Dockerfile -t bp1-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp1-no-key bp1-scoring; then
            echo "ERROR: bp1 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp1 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp1 -e AML_RISKIQ_REQUIRE_AUTH=true -e AML_RISKIQ_API_KEYS=ci-test-key -p 8000:8000 bp1-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs bp1
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp1 || true

  bp2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/bp2_typology_redflag_detection/Dockerfile -t bp2-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp2-no-key bp2-scoring; then
            echo "ERROR: bp2 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp2 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp2 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8001:8001 bp2-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/health; then exit 0; fi
            sleep 2
          done
          docker logs bp2
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp2 || true

  bp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/bp3_network_graph_intelligence/Dockerfile -t bp3-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp3-no-key bp3-scoring; then
            echo "ERROR: bp3 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp3 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp3 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8003:8003 bp3-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8003/health; then exit 0; fi
            sleep 2
          done
          docker logs bp3
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp3 || true

  bp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/bp4_structuring_smurfing_detection/Dockerfile -t bp4-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp4-no-key bp4-scoring; then
            echo "ERROR: bp4 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp4 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp4 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8004:8004 bp4-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8004/health; then exit 0; fi
            sleep 2
          done
          docker logs bp4
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp4 || true

  bp5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/bp5_correspondent_banking_crossborder_risk/Dockerfile -t bp5-scoring .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name bp5-no-key bp5-scoring; then
            echo "ERROR: bp5 started without API-key configuration"
            exit 1
          else
            echo "PASS: bp5 refused to start without API-key configuration"
          fi
      - name: Run
        run: docker run -d --name bp5 -e AML_RISKIQ_API_KEYS=ci-test-key -p 8002:8002 bp5-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8002/health; then exit 0; fi
            sleep 2
          done
          docker logs bp5
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp5 || true

  bp6-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build BP6 batch image
        run: docker build -f src/docker/bp6_enterprise_compliance_monitoring/Dockerfile -t bp6-rollup .
      - name: Execute BP6 rollup against committed report evidence
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            -v "$GITHUB_WORKSPACE/models:/app/models" \
            bp6-rollup
      - name: Verify generated rollup package
        run: |
          set -euo pipefail
          package="reports/bp6_enterprise_compliance_monitoring/executive_package"
          for artifact in \
            "BP6_Platform_Rollup_Report.docx" \
            "BP6_Platform_Rollup_Workbook.xlsx" \
            "BP6_Platform_Rollup_Dashboard.html" \
            "BP6_Platform_Rollup_Deck.pptx"; do
            test -s "$package/$artifact"
          done
          test -s "reports/bp6_enterprise_compliance_monitoring/PLATFORM_CARD.md"
          echo "PASS: BP6 batch job exited successfully and required report outputs are non-empty."

  case-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f src/docker/case_management/Dockerfile -t case-management .
      - name: Verify missing API key fails closed
        run: |
          if docker run --rm --name case-management-no-key case-management; then
            echo "ERROR: case-management started without API-key configuration"
            exit 1
          else
            echo "PASS: case-management refused to start without API-key configuration"
          fi
      - name: Run
        run: >
          docker run -d --name case-management
          -e AML_RISKIQ_API_KEYS=admin:ci-test-key
          -p 8005:8005 case-management
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8005/health; then exit 0; fi
            sleep 2
          done
          docker logs case-management
          exit 1
      - name: Exercise the real RBAC matrix against the running container
        run: |
          set -euo pipefail
          KEY="ci-test-key"
          BASE="http://localhost:8005"
          # admin-role key creates an alert
          ALERT_ID=$(curl -sf -X POST "$BASE/alerts" -H "X-API-Key: $KEY" -H "Content-Type: application/json" \
            -d '{"entity_ref":"ci-acct-1","business_problem":"BP1","detection_source":"xgboost_champion","risk_score":0.9,"selected_threshold":0.5,"model_name":"xgboost_v1"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['alert_id'])")
          echo "Created alert: $ALERT_ID"
          # a request with no key at all must be refused (401) -- real negative-auth check
          # against the actual running container, not just a unit test.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/alerts/$ALERT_ID/notes" \
            -H "Content-Type: application/json" -d '{"text":"should be rejected"}')
          if [ "$STATUS" != "401" ]; then
            echo "ERROR: expected 401 for an unauthenticated write, got $STATUS"
            exit 1
          fi
          echo "PASS: unauthenticated write correctly refused (401)."
      - name: Teardown
        if: always()
        run: docker rm -f case-management || true

  integrated-workflow:
    # Proves the root-level docker-compose.yml (all 6 services wired together) at the
    # deployment level, complementary to -- not a duplicate of -- the pytest-level
    # tests/integration/end_to_end/ suite (same integration logic, in-process, no
    # containers). This job builds case-management + bp3-network-graph-intelligence for
    # real, brings them up together with Compose's own service-name DNS and
    # health-check-gated startup, POSTs a REAL account key to BP3's live /score endpoint,
    # and verifies against the live case-management container that a real alert was
    # created with the originating scoring result's provenance intact.
    #
    # Uses BP3, not BP1/2/4/5, deliberately: BP3 is a deterministic RULE (account_key
    # present in the committed near_train_flagged lookup table -> always alert-worthy),
    # not a probabilistic model with a real selected_threshold of 0.98 -- so this job can
    # assert a real alert IS created without guessing whether an invented feature vector
    # happens to cross that threshold (it would not be honest to fabricate one and hope).
    # "020|800104D70" below is a real node_key from the committed
    # bp3_notebook3_near_train_flagged_lookup_li_medium.parquet with near_train_flagged ==
    # True -- verified by reading that file directly, not invented. BP1/2/4/5 share BP3's
    # exact integration pattern (see docs/architecture/SCORING_ALERT_INTEGRATION.md) and
    # are proven at the unit/pytest level already.
    runs-on: ubuntu-latest
    env:
      CASE_SERVICE_CLIENT_KEY: ci-integrated-case-client-key
      BP3_API_KEYS: ci-integrated-bp3-key
      FLAGGED_ACCOUNT_KEY: "020|800104D70"
    steps:
      - uses: actions/checkout@v7
      - name: Build case-management and bp3 images
        run: docker compose build case-management bp3-network-graph-intelligence
      - name: Prepare writable bind-mount data directories
        # On a fresh checkout, ./data/case_management and ./data/alert_outbox do not
        # exist yet. Docker auto-creates a missing bind-mount source directory as root,
        # mode 0755 -- but every image in this stack drops to a non-root user (see each
        # Dockerfile's `USER app`/`USER appuser`), which cannot write into a root-owned,
        # group/other-unwritable directory. Left unfixed, case-management's own SQLite
        # AlertStore (opened eagerly at import time -- casework/store.py) hits a
        # PermissionError on first write, the process never comes up, its Docker
        # HEALTHCHECK never reports healthy, and `docker compose up` (which blocks on
        # bp3's `depends_on: case-management: condition: service_healthy`) fails before
        # this job's own "Wait for both services to report healthy" step ever runs. This
        # is a real local-deployment gotcha too (see docs/deployment/DEPLOYMENT_GUIDE.md),
        # not only a CI one -- fixed here the same way: create both directories up front
        # and make them writable by any uid.
        run: |
          mkdir -p data/case_management data/alert_outbox
          chmod -R 777 data
      - name: Bring up case-management and bp3 together
        run: docker compose up -d case-management bp3-network-graph-intelligence
      - name: Wait for both services to report healthy
        run: |
          set -euo pipefail
          for service in case-management bp3-network-graph-intelligence; do
            cid=$(docker compose ps -q "$service")
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "PASS: $service is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: $service never became healthy (last status: $status)"
                docker compose logs "$service"
                exit 1
              fi
              sleep 2
            done
          done
      - name: Submit a real, known-flagged account to BP3's live /score endpoint
        id: score
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -X POST http://localhost:8003/score \
            -H "X-API-Key: $BP3_API_KEYS" \
            -H "Content-Type: application/json" \
            -d "{\"account_key\": \"$FLAGGED_ACCOUNT_KEY\"}")
          echo "BP3 /score response: $RESPONSE"
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"
      - name: Verify a real alert was created in case-management, with provenance intact
        run: |
          set -euo pipefail
          RESPONSE='${{ steps.score.outputs.response }}'
          ALERT_PRESENT=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print('yes' if d.get('alert') else 'no')" "$RESPONSE")
          if [ "$ALERT_PRESENT" != "yes" ]; then
            echo "ERROR: BP3's /score response for a known-flagged account carried no 'alert' key."
            exit 1
          fi
          ALERT_ID=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print(d['alert']['alert_id'])" "$RESPONSE")
          echo "BP3 dispatched alert: $ALERT_ID"
          ALERT_JSON=$(curl -sf "http://localhost:8005/alerts/$ALERT_ID" -H "X-API-Key: $CASE_SERVICE_CLIENT_KEY")
          echo "case-management's record of this alert: $ALERT_JSON"
          python3 -c "
          import json, sys
          alert = json.loads(sys.argv[1])
          expected_entity = sys.argv[2]
          assert alert['business_problem'] == 'BP3', alert
          assert alert['entity_ref'] == expected_entity, alert
          assert alert['model_name'], 'model_name provenance missing'
          assert alert['generation_source'] == 'automated_scoring', alert
          assert alert['risk_score'] == 1.0, alert
          print('PASS: alert in case-management preserves BP3 scoring provenance.')
          " "$ALERT_JSON" "$FLAGGED_ACCOUNT_KEY"
      - name: Verify re-submitting the identical account does not create a duplicate alert
        run: |
          set -euo pipefail
          BEFORE=$(curl -sf -G "http://localhost:8005/alerts" --data-urlencode "entity_ref=$FLAGGED_ACCOUNT_KEY" -H "X-API-Key: $CASE_SERVICE_CLIENT_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          curl -sf -X POST http://localhost:8003/score \
            -H "X-API-Key: $BP3_API_KEYS" -H "Content-Type: application/json" \
            -d "{\"account_key\": \"$FLAGGED_ACCOUNT_KEY\"}" > /dev/null
          AFTER=$(curl -sf -G "http://localhost:8005/alerts" --data-urlencode "entity_ref=$FLAGGED_ACCOUNT_KEY" -H "X-API-Key: $CASE_SERVICE_CLIENT_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: alert count for this account changed from $BEFORE to $AFTER on an identical resubmission -- idempotency failed."
            exit 1
          fi
          echo "PASS: identical resubmission did not create a duplicate alert ($BEFORE == $AFTER)."
      - name: Verify an unflagged account produces no alert
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -X POST http://localhost:8003/score \
            -H "X-API-Key: $BP3_API_KEYS" -H "Content-Type: application/json" \
            -d '{"account_key": "03196|800107150"}')
          echo "BP3 /score response for a real, non-flagged account: $RESPONSE"
          ALERT_PRESENT=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print('yes' if d.get('alert') else 'no')" "$RESPONSE")
          if [ "$ALERT_PRESENT" != "no" ]; then
            echo "ERROR: a non-flagged account unexpectedly produced an alert."
            exit 1
          fi
          echo "PASS: non-flagged account correctly produced no alert."
      - name: Dump service logs
        if: always()
        run: docker compose logs
      - name: Teardown
        if: always()
        run: docker compose down -v
