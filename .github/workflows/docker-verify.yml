name: Docker Build & Run Verification

# Verifies the 4 scoring services that can actually build and serve traffic in this repo's
# current state: BP1, BP2, BP4, BP5. BP3's image is deliberately excluded -- it depends on
# models/bp3_network_graph_intelligence/bp3_notebook3_near_train_flagged_lookup_li_medium.parquet,
# a real artifact this platform has not yet generated (disclosed, not a bug -- see
# scripts/check_docker_copy_paths.py's KNOWN_PENDING_ARTIFACTS allowlist and ROADMAP.md).
# BP6 is also excluded -- it is a one-shot batch rollup job with no exposed port and no
# /health endpoint, not a scoring API (see src/docker/bp6_enterprise_compliance_monitoring/Dockerfile).

on: [push, pull_request]

jobs:
  bp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp1_transaction_monitoring_detection/Dockerfile -t bp1-scoring .
      - name: Run
        run: docker run -d --name bp1 -p 8000:8000 bp1-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs bp1
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp1 || true

  bp2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp2_typology_redflag_detection/Dockerfile -t bp2-scoring .
      - name: Run
        run: docker run -d --name bp2 -p 8001:8001 bp2-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/health; then exit 0; fi
            sleep 2
          done
          docker logs bp2
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp2 || true

  bp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp4_structuring_smurfing_detection/Dockerfile -t bp4-scoring .
      - name: Run
        run: docker run -d --name bp4 -p 8001:8001 bp4-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/health; then exit 0; fi
            sleep 2
          done
          docker logs bp4
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp4 || true

  bp5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f src/docker/bp5_correspondent_banking_crossborder_risk/Dockerfile -t bp5-scoring .
      - name: Run
        run: docker run -d --name bp5 -p 8002:8002 bp5-scoring
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8002/health; then exit 0; fi
            sleep 2
          done
          docker logs bp5
          exit 1
      - name: Teardown
        if: always()
        run: docker rm -f bp5 || true
