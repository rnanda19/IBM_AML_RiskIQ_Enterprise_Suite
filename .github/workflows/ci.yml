name: CI

# Lint, type-check and run the real pytest suite across both supported Python versions. Security
# scanning (bandit) lives in code-quality.yml, and the live-reports Pages deployment lives in its
# own pages.yml -- kept separate so each workflow has one job and a failure in one never masks or
# blocks the other. Every step below is genuinely enforcing (no `|| true` fallbacks): a real lint,
# type, or test failure fails this workflow, which is the point of having it.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint/type tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort mypy pydantic

      - name: flake8
        run: python -m flake8 src/ tests/

      - name: black --check
        run: python -m black --check src/ tests/

      - name: isort --check-only
        run: python -m isort --check-only src/ tests/

      - name: mypy
        run: python -m mypy src/

  test-matrix:
    name: Pytest (Py ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: pytest
        run: python -m pytest tests/ -v
