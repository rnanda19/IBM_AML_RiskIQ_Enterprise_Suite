services:
  bp4-structuring-smurfing:
    build:
      context: ../../..
      dockerfile: src/docker/bp4_structuring_smurfing_detection/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - BP4_DATASET_VARIANT=LI-Medium
      # Required for scoring containers: image defaults AML_RISKIQ_REQUIRE_AUTH=true.
      # Supply keys through the deployment environment or a secrets manager.
      - AML_RISKIQ_REQUIRE_AUTH=${AML_RISKIQ_REQUIRE_AUTH:-true}
      - AML_RISKIQ_API_KEYS=${AML_RISKIQ_API_KEYS:-}
    restart: unless-stopped
