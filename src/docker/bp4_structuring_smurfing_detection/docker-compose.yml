services:
  bp4-structuring-smurfing:
    build:
      context: ../../..
      dockerfile: src/docker/bp4_structuring_smurfing_detection/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - BP4_DATASET_VARIANT=LI-Medium
      # Hardening addition (2026-10-02): unset by default (open mode, documented in
      # src/aml_riskiq/serving/_security.py) -- set this to a comma-separated key list to require
      # the X-API-Key header on /score. Uncomment to enable auth for this container:
      # - AML_RISKIQ_API_KEYS=change-me-to-a-real-key
    restart: unless-stopped
