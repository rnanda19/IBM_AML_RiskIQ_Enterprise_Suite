services:
  bp2-typology-detection:
    build:
      context: ../../..
      dockerfile: src/docker/bp2_typology_redflag_detection/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - BP2_DATASET_VARIANT=LI-Medium
      # Hardening addition (2026-10-02): unset by default (open mode, documented in
      # src/services/_security.py) -- set this to a comma-separated key list to require
      # the X-API-Key header on /score. Uncomment to enable auth for this container:
      # - AML_RISKIQ_API_KEYS=change-me-to-a-real-key
    restart: unless-stopped
