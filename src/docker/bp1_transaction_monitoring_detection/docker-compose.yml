services:
  bp1-transaction-monitoring:
    build:
      context: ../../..
      dockerfile: src/docker/bp1_transaction_monitoring_detection/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BP1_DATASET_VARIANT=LI-Medium
      # Required for scoring containers: image defaults AML_RISKIQ_REQUIRE_AUTH=true.
      # Provide AML_RISKIQ_API_KEYS via the deployment environment or secrets manager.
      - AML_RISKIQ_REQUIRE_AUTH=${AML_RISKIQ_REQUIRE_AUTH:-true}
      - AML_RISKIQ_API_KEYS=${AML_RISKIQ_API_KEYS:-}
    restart: unless-stopped
