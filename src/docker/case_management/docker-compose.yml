services:
  case-management:
    build:
      context: ../../..
      dockerfile: src/docker/case_management/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - AML_RISKIQ_API_KEYS=${AML_RISKIQ_API_KEYS:-}
    volumes:
      - ../../../data/case_management:/app/data/case_management
    restart: "no"
