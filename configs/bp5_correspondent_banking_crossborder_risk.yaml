target_column: Is Laundering
ground_truth_note: Same real direct label as BP1/BP4 -- this dataset carries no independent
  sanctions-hit or correspondent-risk label; BP5 tests whether real structural cross-border/corridor
  features carry real predictive lift for Is Laundering generally.
mandatory_validation_tier: LI-Medium
optional_stretch_tier: HI-Large
